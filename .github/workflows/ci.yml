name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, not just the first failure.
      fail-fast: false
      matrix:
        # macos disabled until cachix / nix caching works properly on macos ci runners
        # currently it is extremely slow (~90+ seconds compared to ~10 seconds on linux)
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # CI runs the same tool versions as the dev shell, so a green run
      # locally means a green run here.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: stylua
        run: nix develop --command stylua --check .

      - name: luacheck
        run: nix develop --command luacheck .

      - name: test
        run: nix develop --command vusted ./test
